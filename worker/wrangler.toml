name = "kept-extract"
main = "src/index.ts"
compatibility_date = "2026-04-01"
workers_dev = true
preview_urls = true

[vars]
CF_ACCOUNT_ID = "605dc882eab2e287ef2a63090e99df9a"
AI_GATEWAY_ID = "kept"
# OpenAI (default) or Claude via AI Gateway compat endpoint:
#   openai/gpt-4o-mini
#   anthropic/claude-haiku-4-5
LLM_MODEL = "openai/gpt-4o-mini"
# Wallet pass identity (public). PEMs are secrets — see docs/PASS_CERTS.md
PASS_TYPE_IDENTIFIER = "pass.com.tade.Kept"
TEAM_IDENTIFIER = "TU566926VK"

# Secrets (wrangler secret put / .dev.vars — never commit):
#   EXTRACT_SECRET
#   OPENAI_API_KEY          — if using openai/*
#   ANTHROPIC_API_KEY       — if using anthropic/*
#   CF_AIG_TOKEN            — if AI Gateway auth is ON
#   SIGNER_CERT_PEM
#   SIGNER_KEY_PKCS8_PEM
#   WWDR_PEM

[[ratelimits]]
name = "EXTRACT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# AI Gateway: request-body logging OFF
