name = "kept-extract"
main = "src/index.ts"
compatibility_date = "2026-04-01"
workers_dev = true
preview_urls = true

[vars]
CF_ACCOUNT_ID = "605dc882eab2e287ef2a63090e99df9a"
AI_GATEWAY_ID = "kept"
# Model via AI Gateway compat endpoint. Examples:
#   openai/gpt-4o-mini
#   anthropic/claude-haiku-4-5
#   google-ai-studio/gemini-2.0-flash
LLM_MODEL = "openai/gpt-4o-mini"
# Pro-tier extraction model. Served only to customers whose Pro
# entitlement is verified against RC on each /extract request; free
# users always get LLM_MODEL. Unset → Pro users silently fall back.
LLM_MODEL_PRO = "openai/gpt-4o"
# Wallet pass identity (public). PEMs are secrets — see docs/PASS_CERTS.md
# The signing certificate on Cloudflare is issued for `pass.com.tade.devpass`;
# swapping identifiers here without re-uploading certs breaks /pass.
PASS_TYPE_IDENTIFIER = "pass.com.tade.devpass"
TEAM_IDENTIFIER = "TU566926VK"
RC_ENTITLEMENT_IDENTIFIER = "Kept Pro"

# Secrets (wrangler secret put / .dev.vars — never commit):
#   EXTRACT_SECRET
#   OPENAI_API_KEY          — if using openai/*
#   ANTHROPIC_API_KEY       — if using anthropic/*
#   CF_AIG_TOKEN            — if AI Gateway auth is ON
#   SIGNER_CERT_PEM
#   SIGNER_KEY_PKCS8_PEM
#   WWDR_PEM

[[ratelimits]]
name = "EXTRACT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# AI Gateway: request-body logging OFF
