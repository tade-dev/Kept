name = "kept-extract"
main = "src/index.ts"
compatibility_date = "2026-04-01"
workers_dev = true
preview_urls = true

[vars]
CF_ACCOUNT_ID = "605dc882eab2e287ef2a63090e99df9a"
AI_GATEWAY_ID = "kept"
# OpenAI (default) or Claude via AI Gateway compat endpoint:
#   openai/gpt-4o-mini
#   anthropic/claude-haiku-4-5
LLM_MODEL = "openai/gpt-4o-mini"

# Secrets (wrangler secret put / .dev.vars — never commit):
#   EXTRACT_SECRET
#   OPENAI_API_KEY          — if using openai/*
#   ANTHROPIC_API_KEY       — if using anthropic/*
#   CF_AIG_TOKEN            — if AI Gateway auth is ON

[[ratelimits]]
name = "EXTRACT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# AI Gateway: request-body logging OFF
